<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y. - Stark OS AI Assistant</title>
    <style>
        :root {
            --primary-neon: #00f3ff;
            --primary-glow: rgba(0, 243, 255, 0.4);
            --bg-color: #03070c;
            --panel-bg: rgba(3, 15, 25, 0.85);
            --text-color: #cceeff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, #05192d 0%, #03070c 100%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 2px solid var(--primary-neon);
            background: var(--panel-bg);
            box-shadow: 0 0 15px var(--primary-glow);
            z-index: 10;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            letter-spacing: 3px;
            color: var(--primary-neon);
            text-shadow: 0 0 10px var(--primary-neon);
        }

        .status-indicator {
            font-size: 0.85rem;
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .main-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        .sidebar {
            background: rgba(2, 10, 18, 0.9);
            border-right: 1px solid rgba(0, 243, 255, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(0, 243, 255, 0.2);
            background: radial-gradient(circle, rgba(0,243,255,0.05) 0%, transparent 70%);
            overflow: hidden;
        }

        /* Iron Man HUD / Holo Face Simulation */
        .holo-face {
            position: relative;
            width: 140px;
            height: 180px;
            border: 2px dashed rgba(0, 243, 255, 0.4);
            border-radius: 50% 50% 40% 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px var(--primary-glow);
            animation: rotateHolo 20s linear infinite;
        }

        .holo-eyes {
            position: absolute;
            top: 60px;
            width: 80px;
            display: flex;
            justify-content: space-between;
        }

        .eye {
            width: 25px;
            height: 12px;
            background: var(--primary-neon);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--primary-neon);
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 96%, 98% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }

        .holo-mouth {
            position: absolute;
            bottom: 45px;
            width: 40px;
            height: 4px;
            background: var(--primary-neon);
            box-shadow: 0 0 10px var(--primary-neon);
        }

        @keyframes rotateHolo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.8rem;
            color: var(--primary-neon);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, textarea, button {
            background: rgba(0, 20, 35, 0.8);
            border: 1px solid var(--primary-neon);
            color: var(--text-color);
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 4px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            box-shadow: 0 0 10px var(--primary-neon);
            background: rgba(0, 40, 70, 0.8);
        }

        button {
            cursor: pointer;
            background: rgba(0, 243, 255, 0.1);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: var(--primary-neon);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--primary-neon);
        }

        .chat-section {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(3, 10, 18, 0.6);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-top-right-radius: 0;
        }

        .message.friday {
            align-self: flex-start;
            background: rgba(0, 20, 40, 0.9);
            border: 1px solid var(--primary-neon);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
            border-top-left-radius: 0;
        }

        .message.friday::before {
            content: "F.R.I.D.A.Y.: ";
            font-weight: bold;
            color: var(--primary-neon);
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
        }

        .chat-input-area {
            padding: 20px;
            background: var(--panel-bg);
            border-top: 1px solid rgba(0, 243, 255, 0.3);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-area textarea {
            flex: 1;
            resize: none;
            height: 45px;
        }

        .action-btn {
            padding: 10px 20px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-active {
            background: #ff0055 !important;
            border-color: #ff0055 !important;
            box-shadow: 0 0 15px #ff0055 !important;
        }
    </style>
</head>
<body>

        <div class="logo-area">
            <h1>F.R.I.D.A.Y. // STARK PROTOCOL</h1>
        </div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>SYSTEM ONLINE</span>
        </div>
    </header>
